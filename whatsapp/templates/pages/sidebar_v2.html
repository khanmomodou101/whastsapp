{% block style %}
<style>
    :root {
        --brand-purple: #ff6b35;
        --brand-purple-50: #f6f4fe;
        --brand-purple-100: #ede9fd;
        --brand-purple-600: #ff6b35;
        --brand-purple-700: #ff6b35;
        --brand-purple-800: #ff6b35;
    }

    /* Sidebar container */
    .jk-sidebar-payroll {
        height: 100vh;
        background: #1e1f2d;
        color: #94a3b8;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 1001;
        display: flex;
        flex-direction: column;
        font-family: system-ui, -apple-system, sans-serif;
        transition: all 0.3s ease;
        border-right: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Navigation */
    .jk-sidebar-nav {
        flex: 1;
        overflow-y: auto;
        padding: 1rem 0.75rem;
    }

    .jk-sidebar-nav::-webkit-scrollbar {
        width: 4px;
    }

    .jk-sidebar-nav::-webkit-scrollbar-track {
        background: transparent;
    }

    .jk-sidebar-nav::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
    }

    .jk-nav-section {
        margin-bottom: 1.5rem;
    }

    .jk-nav-section:last-child {
        margin-bottom: 0.5rem;
    }

    .jk-nav-section-title {
        font-size: 0.6875rem;
        font-weight: 600;
        text-transform: uppercase;
        color: #64748b;
        padding: 0 0.75rem;
        margin: 1.25rem 0 0.5rem;
        letter-spacing: 0.05em;
    }

    .jk-nav-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.625rem 0.75rem;
        border-radius: 0.375rem;
        color: #94a3b8;
        text-decoration: none;
        transition: all 0.2s ease;
        font-size: 0.875rem;
        font-weight: 500;
        position: relative;
        margin: 0.125rem 0;
    }

    .jk-nav-item:hover {
        background: rgba(255, 255, 255, 0.05);
        color: white;
    }

    .jk-nav-item.active {
        background: #ff6b35;
        color: white;
    }

    .jk-nav-item.getting-started {
        background: rgba(255, 255, 255, 0.05);
        margin-bottom: 0.5rem;
    }

    .jk-nav-item.getting-started .progress-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        height: 3px;
        width: 35%;
        background: #ff6b35;
        border-radius: 0 1.5px 1.5px 0;
    }

    .jk-nav-item i {
        font-size: 1.125rem;
        width: 1.5rem;
        text-align: center;
    }

    .jk-nav-item .jk-nav-arrow {
        margin-left: auto;
        opacity: 0.5;
        font-size: 0.75rem;
    }

    .jk-nav-item.dashboard {
        background: #ff6b35;
        color: white;
        margin-bottom: 0.5rem;
    }

    .jk-nav-item.dashboard:hover {
        background: #ff6b35;
    }

    .jk-nav-support {
        margin-top: auto;
        padding: 1rem;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .jk-nav-support .jk-nav-item {
        color: #64748b;
    }

    .jk-nav-support .jk-nav-item:hover {
        color: #94a3b8;
    }

    /* Mobile styles */
    @media (max-width: 768px) {
        .jk-sidebar-payroll {
            transform: translateX(-100%);
            transition: transform 0.3s ease;
        }

        .jk-sidebar-payroll.show {
            transform: translateX(0);
        }

        /* Ensure main content takes full width on mobile */
        .main-content {
            margin-left: 0 !important;
            width: 100% !important;
        }

        .dashboard-container .main-content {
            margin-left: 0 !important;
        }
    }

    /* Mobile toggle button */
    .jk-sidebar-toggle {
        display: none;
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 1002;
        background: #1e1f2d;
        border: 1px solid rgba(255, 255, 255, 0.1);
        width: 40px;
        height: 40px;
        border-radius: 0.5rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        color: #94a3b8;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 1.25rem;
        align-items: center;
        justify-content: center;
    }

    .jk-sidebar-toggle:hover {
        background: #ff6b35;
        color: white;
        border-color: rgba(37, 99, 235, 0.1);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
    }

    .jk-sidebar-toggle .fa-bars,
    .jk-sidebar-toggle .fa-times {
        position: absolute;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .jk-sidebar-toggle .fa-times {
        opacity: 0;
        transform: rotate(-180deg) scale(0.8);
    }

    .jk-sidebar-payroll.show ~ .jk-sidebar-toggle {
        left: auto;
        right: 1rem;
    }

    .jk-sidebar-payroll.show ~ .jk-sidebar-toggle .fa-bars {
        opacity: 0;
        transform: rotate(180deg) scale(0.8);
    }

    .jk-sidebar-payroll.show ~ .jk-sidebar-toggle .fa-times {
        opacity: 1;
        transform: rotate(0) scale(1);
    }

    @media (max-width: 1024px) {
        .jk-sidebar-toggle {
            display: flex;
        }
    }

    @media (max-width: 768px) {
        .jk-sidebar-toggle {
            display: flex;
            top: 1rem;
            left: 1rem;
        }
    }

    /* Overlay */
    .jk-sidebar-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(15, 23, 42, 0.3);
        backdrop-filter: blur(2px);
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.3s ease;
    }

    .jk-sidebar-overlay.show {
        display: block;
        opacity: 1;
    }

    .jk-nav-item.has-submenu {
        cursor: pointer;
    }

    .jk-nav-item.has-submenu .jk-nav-arrow {
        transition: transform 0.2s ease;
    }

    .jk-nav-item.has-submenu.expanded .jk-nav-arrow {
        transform: rotate(90deg);
    }

    .jk-submenu {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
    }

    .jk-submenu.expanded {
        max-height: 500px;
    }

    .jk-submenu-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.5rem 0.75rem 0.5rem 2.75rem;
        color: #94a3b8;
        text-decoration: none;
        transition: all 0.2s ease;
        font-size: 0.8125rem;
        font-weight: 500;
        border-radius: 0.375rem;
        margin: 0.125rem 0;
    }

    .jk-submenu-item:hover {
        background: rgba(255, 255, 255, 0.05);
        color: white;
    }

    .jk-submenu-item.active {
        background: #ff6b35;
        color: white;
    }

    .jk-submenu-item i {
        font-size: 1rem;
        width: 1.25rem;
        text-align: center;
        opacity: 0.9;
    }
</style>
{% endblock %}

<!-- Font Awesome and Inter font -->

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">

<!-- Overlay for mobile -->
<div class="jk-sidebar-overlay" id="sidebarOverlay"></div>

<!-- Sidebar -->
<aside class="jk-sidebar-payroll">

    </div>
    
    <nav class="jk-sidebar-nav">

                <a href="/whatsapp/contact" class="jk-nav-item {% if active_page == 'contact' %}active{% endif %}">

        <!-- Management Section -->
        

        <!-- Operations Section -->
       
    </nav>

    <!-- Support Section -->
    <div class="jk-nav-support">
        <a href="/payroll/support" class="jk-nav-item {% if active_page == 'support' %}active{% endif %}">
            <i class="fas fa-life-ring"></i>
            Contact Support
        </a>
    </div>

<!-- Mobile toggle button -->
<button class="jk-sidebar-toggle" id="sidebarToggle" aria-label="Toggle Menu">
    <i class="fas fa-bars"></i>
    <i class="fas fa-times"></i>
</button>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const sidebar = document.querySelector('.jk-sidebar-payroll');
    const overlay = document.getElementById('sidebarOverlay');
    const toggleBtn = document.getElementById('sidebarToggle');
    const navLinks = document.querySelectorAll('.jk-nav-link.has-subitems');
    const submenuTriggers = document.querySelectorAll('.jk-nav-item.has-submenu');
    
    // Toggle sidebar function
    function toggleSidebar() {
        sidebar.classList.toggle('show');
        overlay.classList.toggle('show');
        document.body.style.overflow = sidebar.classList.contains('show') ? 'hidden' : '';
    }

    // Make toggleSidebar globally accessible
    window.toggleSidebar = toggleSidebar;

    // Toggle subitems function
    function toggleSubitems(e) {
        if (!e.currentTarget.classList.contains('has-subitems')) return;
        
        e.preventDefault();
        const isExpanded = e.currentTarget.classList.contains('expanded');
        const subitems = e.currentTarget.nextElementSibling;
        
        // Close other subitems
        navLinks.forEach(link => {
            if (link !== e.currentTarget) {
                link.classList.remove('expanded');
                if (link.nextElementSibling) {
                    link.nextElementSibling.classList.remove('expanded');
                }
            }
        });

        // Toggle current subitems
        e.currentTarget.classList.toggle('expanded');
        subitems.classList.toggle('expanded');
    }

    // Toggle submenu function
    function toggleSubmenu(e) {
        e.preventDefault();
        const submenu = e.currentTarget.nextElementSibling;
        const isExpanded = e.currentTarget.classList.contains('expanded');
        
        // Close all other submenus
        submenuTriggers.forEach(trigger => {
            if (trigger !== e.currentTarget) {
                trigger.classList.remove('expanded');
                trigger.nextElementSibling.classList.remove('expanded');
            }
        });
        
        // Toggle current submenu
        e.currentTarget.classList.toggle('expanded');
        submenu.classList.toggle('expanded');
        
        // If this submenu was closed and is now being opened, scroll it into view
        if (!isExpanded) {
            setTimeout(() => submenu.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
        }
    }

    // Add click events
    if (toggleBtn) {
        toggleBtn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            toggleSidebar();
        });
    }

    if (overlay) {
        overlay.addEventListener('click', toggleSidebar);
    }

    navLinks.forEach(link => {
        link.addEventListener('click', toggleSubitems);
    });

    submenuTriggers.forEach(trigger => {
        trigger.addEventListener('click', toggleSubmenu);
    });

    // Close sidebar when clicking outside
    document.addEventListener('click', (e) => {
        if (window.innerWidth <= 1024 && 
            sidebar.classList.contains('show') && 
            !sidebar.contains(e.target) && 
            !toggleBtn.contains(e.target)) {
            toggleSidebar();
        }
    });

    // Handle window resize
    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            if (window.innerWidth > 1024) {
                sidebar.classList.remove('show');
                if (overlay) overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }, 250);
    });

    // Ensure sidebar is hidden by default on mobile
    if (window.innerWidth <= 768) {
        sidebar.classList.remove('show');
        if (overlay) overlay.classList.remove('show');
    }
});</script>
