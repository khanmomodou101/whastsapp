    <script>
        // User dropdown toggle
        
        // Logout functionality
        document.getElementById('logoutBtn').addEventListener('click', (e) => {
            e.preventDefault();
            fetch('/api/method/logout', {
                method: 'GET',
                credentials: 'same-origin',
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => response.json())
            .then(() => {
                window.location.href = '/login';
            })
            .catch(error => {
                console.error('Logout error:', error);
                window.location.href = '/login';
            });
        });

        // Session keepalive
        const KEEPALIVE_INTERVAL = 10 * 60 * 1000; // 10 minutes

        function pingServer() {
            fetch('/api/method/frappe.auth.ping', {
                method: 'GET',
                credentials: 'same-origin',
                headers: {
                    'Accept': 'application/json',
                    'X-Frappe-CSRF-Token': frappe.csrf_token || ''
                }
            }).catch(console.error);
        }

        setInterval(pingServer, KEEPALIVE_INTERVAL);

        let idleTimer;
        function resetIdleTimer() {
            clearTimeout(idleTimer);
            idleTimer = setTimeout(pingServer, 2 * 60 * 1000);
        }

        ['mousedown', 'mousemove', 'keypress', 'scroll', 'touchstart'].forEach(
            event => document.addEventListener(event, resetIdleTimer, true)
        );

        resetIdleTimer();
    </script>
